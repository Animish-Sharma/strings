# Drop this at .github/workflows/witsoc-2.yml in whichever repository hosts the
# skill. It runs the backend-free suite: every toolchain-dependent check reports
# NOT_RUN, which the suite counts and prints rather than treating as a pass.
name: witsoc-2
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Suite
        run: bash skills/witsoc-2/.ci/run.sh
