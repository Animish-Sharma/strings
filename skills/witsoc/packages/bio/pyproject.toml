[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "witsoc-bio"
version = "1.0.1"
description = "Witsoc biology domain pack"
readme = {text = "The biology domain pack for the Witsoc research architecture. Install it directly only for inspection; the Witsoc skill installs and activates this pinned pack automatically when a biological task is routed.", content-type = "text/markdown"}
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [{name = "Witsoc contributors"}]
dependencies = []
keywords = ["biology", "research", "open-problems", "causal-inference"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
witsoc-bio-pack = "witsoc_domain_bio.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/witsoc_domain_bio"]

[tool.hatch.build.targets.sdist]
include = ["src/witsoc_domain_bio", "pyproject.toml"]
