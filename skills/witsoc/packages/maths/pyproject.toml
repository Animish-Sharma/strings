[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "witsoc"
version = "1.0.1"
description = "Witsoc mathematics domain pack"
readme = {text = "The mathematics domain pack for the Witsoc research architecture. Install it directly only for inspection; the Witsoc skill installs and activates this pinned pack automatically when a mathematical task is routed.", content-type = "text/markdown"}
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [{name = "Witsoc contributors"}]
dependencies = []
keywords = ["mathematics", "research", "open-problems", "verification"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.scripts]
witsoc-pack = "witsoc_domain_maths.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/witsoc_domain_maths"]

[tool.hatch.build.targets.sdist]
include = ["src/witsoc_domain_maths", "pyproject.toml"]
